# Checks every pull request; pushes run nothing.
name: CI

on:
  pull_request:

# A newer push to the same pull request cancels the run before it.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [check, test, features, doc]
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain `rust-toolchain.toml` pins, with
      # rustfmt and clippy, on the first cargo call.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: make ${{ matrix.target }}
