[package]
name = "cherry-engine"
description = "The engine of Cherry, an embeddable text editor: the Vim grammar where you navigate and Emacs editing where you type, or strict Vim, Emacs, or desktop keys, painted by whatever toolkit hosts it."
version = "0.0.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
keywords = ["editor", "vim", "emacs", "modal", "text-editing"]
categories = ["text-editors", "gui"]
include = ["Cargo.toml", "LICENSE-APACHE", "LICENSE-MIT", "benches/**/*.rs", "examples/*.rs", "src/**/*.rs", "tests/**/*.rs"]
repository.workspace = true

# docs.rs documents the `syntax` module too.
[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
# Search patterns. Default features kept: Unicode classes and case folding
# serve smart case on any script. 1.10 is the first to read Vim's word
# edges `\<` and `\>`.
regex = "1.10"
# Without the default `unicode_lines`, only `\n` breaks a line; the document
# normalizes every other line ending to it.
ropey = { version = "1", default-features = false, features = ["simd"] }
# Saving undo histories and loading keymaps, behind the `serde` feature.
serde = { version = "1", features = ["derive"], optional = true }
slotmap = "1"
thiserror = "2"
# The visual order of right-to-left and mixed-direction text in a row.
unicode-bidi = "0.3"
# Where a line wrapped at words may break (UAX #14).
unicode-linebreak = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
# The `syntax` module's highlighting: VS Code's TextMate grammars,
# tokenized as VS Code does, and tree-sitter syntax trees, through iris
# (whose `tree_sitter` re-export the bundled grammars load into: they depend
# only on `tree-sitter-language`, so any 0.25 core loads them).
iris = { path = "../../../iris/crates/iris", version = "0.0.1", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }

[features]
# Serialize and Deserialize for saved undo histories (`SavedHistory`) and
# keymap files (`KeymapFile`), for a host to keep them across sessions.
serde = ["dep:serde"]
# Tree-sitter highlighting and structural text objects (the `syntax`
# module), with all five bundled grammars.
syntax = ["syntax-json", "syntax-markdown", "syntax-python", "syntax-rust", "syntax-textmate", "syntax-toml"]
# The `syntax` module without a grammar, for one that names its own.
syntax-engine = ["dep:iris", "iris/tree-sitter"]
# One bundled grammar each, the engine with it.
syntax-json = ["syntax-engine", "dep:tree-sitter-json"]
syntax-markdown = ["syntax-engine", "dep:tree-sitter-md"]
syntax-python = ["syntax-engine", "dep:tree-sitter-python"]
syntax-rust = ["syntax-engine", "dep:tree-sitter-rust"]
syntax-toml = ["syntax-engine", "dep:tree-sitter-toml-ng"]
# TextMate highlighting of every other language (`syntax::TextMateHighlighter`),
# through iris and the grammars VS Code ships.
syntax-textmate = ["dep:iris", "iris/grammars"]

[dev-dependencies]
# Benchmarks only. No plots or parallel analysis: numbers are enough.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# The `serde` feature's tests read and write JSON.
serde_json = "1"
# Only the terminal example uses crossterm; the library stays toolkit-free.
crossterm = "0.29"

[[example]]
name = "term"
test = true
# It highlights with the `syntax` module.
required-features = ["syntax"]

[[bench]]
name = "keystroke"
harness = false
