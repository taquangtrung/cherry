# The editor and the crates built on it. Each is a crate of its own, so the
# library's builds and tests never compile a toolkit:
#
# - `crates/cherry`: the crate apps add, re-exporting the two below; its
#   default `misty` feature adds `cherry-misty` (`make facade`).
# - `crates/cherry-engine`: the editor engine, toolkit-free.
# - `crates/cherry-misty`: Cherry on the misty GUI framework (`make misty`).
# - `examples/cherry-egui`: a GUI host on egui, an example never published
#   (`make gui`).
#
# Cargo run at the root builds only the engine; `-p` names another crate.
[workspace]
members = ["crates/cherry", "crates/cherry-engine", "crates/cherry-misty", "examples/cherry-egui"]
default-members = ["crates/cherry-engine"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Trung Ta <taquangtrungvn@gmail.com>"]
license = "MIT OR Apache-2.0"
# The verified floor: `rust-toolchain.toml` pins 1.100.0.
rust-version = "1.100"
repository = "https://github.com/taquangtrung/cherry"

[workspace.dependencies]
# Without the misty adapter unless a member asks for it.
cherry = { version = "0.0.2", path = "crates/cherry", default-features = false }
cherry-engine = { version = "0.0.1", path = "crates/cherry-engine" }
cherry-misty = { version = "0.0.1", path = "crates/cherry-misty" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
misty = "0.0.2"
